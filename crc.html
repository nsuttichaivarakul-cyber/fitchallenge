// ── HELPERS ───────────────────────────────────────────────────────────────────
function calcScore(base,curr){
  if(!base||!curr||base.fat==null||curr.fat==null||base.muscle==null||curr.muscle==null)return null;
  const fatD=base.fat-curr.fat, musD=curr.muscle-base.muscle;
  return{fatD,musD,fatPts:Math.round(fatD*10*10)/10,musPts:Math.round(musD*10*10)/10,
         total:Math.round((fatD+musD)*10*10)/10};
}
function getMissionTotal(missions,teamId){
  const tm=missions[teamId]||{};
  return Object.values(tm).reduce((s,m)=>s+(m.points||0),0);
}
function readFile(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);}

// ── AVATAR ────────────────────────────────────────────────────────────────────
function Avatar({src,name,size=38,leader=false}){
  const cols=["#dc2626","#1d4ed8","#b91c1c","#1e40af","#7f1d1d","#059669","#c2410c","#7c3aed","#0891b2","#d97706"];
  const idx=name.split("").reduce((a,c)=>a+c.charCodeAt(0),0)%cols.length;
  return(
    <div style={{position:"relative",flexShrink:0}}>
      {src
        ?<img src={src} alt={name} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:`2px solid ${leader?"#d97706":C.border}`}}/>
        :<div style={{width:size,height:size,borderRadius:"50%",background:cols[idx],display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.36,fontWeight:800,color:"#fff",border:`2px solid ${leader?"#d97706":"rgba(0,0,0,.08)"}`}}>
          {name.slice(0,2).toUpperCase()}
        </div>
      }
      {leader&&<div style={{position:"absolute",bottom:-2,right:-2,background:"#d97706",borderRadius:"50%",width:14,height:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,border:"1.5px solid #fff"}}>⭐</div>}
    </div>
  );
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  return <div style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",background:C.navy,color:"#fff",fontWeight:700,padding:"13px 28px",borderRadius:14,zIndex:9999,boxShadow:"0 8px 32px rgba(0,0,0,.25)",fontSize:14,whiteSpace:"nowrap",animation:"fadeUp .25s ease"}}>{msg}</div>;
}

// ── MEMBER ROW ────────────────────────────────────────────────────────────────
function MemberRow({m, checkins, activeCP, photos}){
  const history = checkins[m.key] || {};
  const base    = history.baseline;
  const photo   = photos[m.key];

  // CP order for fallback
  const cpOrder = ["cp4","cp3","cp2","cp1"];
  const selectedData = history[activeCP];
  const latestAvailId = cpOrder.find(c => history[c]);
  const curr   = selectedData || (latestAvailId ? history[latestAvailId] : null);
  const usedCP = selectedData ? activeCP : latestAvailId;

  // Score vs BASELINE (cumulative — used for ranking)
  const sBase = (base && curr) ? calcScore(base, curr) : null;

  // Score vs PREVIOUS CP (change this round)
  const cpIdx = CPS.findIndex(c => c.id === usedCP);
  const prevCPId = cpIdx > 1 ? CPS[cpIdx - 1].id : "baseline";
  const prevData = history[prevCPId] || base;
  const sPrev = (prevData && curr && usedCP && usedCP !== "baseline")
    ? calcScore(prevData, curr) : null;

  // All checkpoints with data for timeline
  const timeline = CPS.filter(c => history[c.id]);

  function ScoreBadge({label, val, small}){
    const pos = val >= 0;
    return <span style={{
      fontSize: small?10:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
      background: pos ? C.greenBg : C.redBg,
      color: pos ? C.green : C.red,
      border: `1px solid ${pos ? C.greenBorder : C.redBorder}`
    }}>{label}: {pos?"+":""}{val.toFixed(1)}</span>;
  }

  return(
    <div style={{padding:"12px 0", borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:"grid", gridTemplateColumns:"44px 1fr auto", gap:12, alignItems:"flex-start"}}>
        <Avatar src={photo} name={m.first} size={40} leader={m.leader}/>
        <div>
          <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:3}}>
            <span style={{fontWeight:800, fontSize:14, color:C.text}}>{m.first} {m.last}</span>
            {m.leader && <span style={{fontSize:10, background:C.goldBg, color:C.gold,
              padding:"1px 7px", borderRadius:20, fontWeight:700,
              border:`1px solid ${C.goldBorder}`}}>⭐ Leader</span>}
          </div>
          {base
            ? <div style={{fontSize:11, color:C.textFaint}}>
                Baseline: Fat {base.fat}% · Muscle {base.muscle}% {base.weight ? `· ${base.weight}kg` : ""}
              </div>
            : <div style={{fontSize:11, color:C.textFaint}}>No baseline yet</div>
          }

          {/* Change vs PREVIOUS CP */}
          {sPrev && curr && (
            <div style={{marginTop:6}}>
              <div style={{fontSize:10, color:C.blue, fontWeight:700, textTransform:"uppercase",
                letterSpacing:".08em", marginBottom:4}}>
                vs {CPS.find(c=>c.id===prevCPId)?.label||"Baseline"} → {CPS.find(c=>c.id===usedCP)?.label} (this round)
              </div>
              <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                  background: sPrev.fatD>=0 ? C.greenBg : C.redBg,
                  color: sPrev.fatD>=0 ? C.green : C.red,
                  border:`1px solid ${sPrev.fatD>=0 ? C.greenBorder : C.redBorder}`}}>
                  Fat {prevData.fat}% → {curr.fat}% ({sPrev.fatD>=0?"−":"+"}{Math.abs(sPrev.fatD).toFixed(1)}%)
                </span>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                  background: sPrev.musD>=0 ? C.greenBg : C.redBg,
                  color: sPrev.musD>=0 ? C.green : C.red,
                  border:`1px solid ${sPrev.musD>=0 ? C.greenBorder : C.redBorder}`}}>
                  Muscle {prevData.muscle}% → {curr.muscle}% ({sPrev.musD>=0?"+":"−"}{Math.abs(sPrev.musD).toFixed(1)}%)
                </span>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                  background: sPrev.total>=0 ? C.greenBg : C.redBg,
                  color: sPrev.total>=0 ? C.green : C.red,
                  border:`1px solid ${sPrev.total>=0 ? C.greenBorder : C.redBorder}`}}>
                  This round: {sPrev.total>=0?"+":""}{sPrev.total.toFixed(1)} pts
                </span>
              </div>
            </div>
          )}

          {/* Total vs BASELINE */}
          {sBase && (
            <div style={{marginTop:6}}>
              <div style={{fontSize:10, color:C.textFaint, fontWeight:700, textTransform:"uppercase",
                letterSpacing:".08em", marginBottom:4}}>
                vs Baseline → {CPS.find(c=>c.id===usedCP)?.label} (total progress)
              </div>
              <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                  background: sBase.fatD>=0 ? C.greenBg : C.redBg,
                  color: sBase.fatD>=0 ? C.green : C.red,
                  border:`1px solid ${sBase.fatD>=0 ? C.greenBorder : C.redBorder}`}}>
                  Fat: {sBase.fatD>=0?"−":"+"}{Math.abs(sBase.fatD).toFixed(1)}% total
                </span>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                  background: sBase.musD>=0 ? C.greenBg : C.redBg,
                  color: sBase.musD>=0 ? C.green : C.red,
                  border:`1px solid ${sBase.musD>=0 ? C.greenBorder : C.redBorder}`}}>
                  Muscle: {sBase.musD>=0?"+":"−"}{Math.abs(sBase.musD).toFixed(1)}% total
                </span>
              </div>
            </div>
          )}

          {/* CP Timeline — card style like fitness challenge */}
          {timeline.length > 0 && (
            <div style={{marginTop:10}}>
              <div style={{fontSize:10,fontWeight:700,color:C.textFaint,
                textTransform:"uppercase",letterSpacing:".08em",marginBottom:6}}>
                Check-in History
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {/* Baseline card */}
                {base && (
                  <div style={{background:C.bg,border:`1px solid ${C.border}`,
                    borderRadius:10,padding:"8px 10px",minWidth:90}}>
                    <div style={{fontSize:10,fontWeight:700,color:C.textFaint,marginBottom:4}}>Baseline</div>
                    {base.weight&&<div style={{fontSize:11,color:C.textMid,marginBottom:2}}>⚖️ {base.weight}kg</div>}
                    <div style={{fontSize:12,fontWeight:700,color:C.red}}>🔴 {base.fat}%</div>
                    <div style={{fontSize:12,fontWeight:700,color:C.blue}}>🔵 {base.muscle}%</div>
                  </div>
                )}
                {/* CP cards */}
                {timeline.filter(c=>c.id!=="baseline").map((c,i)=>{
                  const d=history[c.id];
                  const allCPs=["baseline","cp1","cp2","cp3","cp4"];
                  const cIdx=allCPs.indexOf(c.id);
                  const prevId=allCPs[cIdx-1];
                  const prevD=history[prevId]||base;
                  const diff=prevD&&d?calcScore(prevD,d):null;
                  const isCurrent=c.id===usedCP;
                  return(
                    <div key={c.id} style={{
                      background:isCurrent?"#f0fdf4":C.bg,
                      border:`1.5px solid ${isCurrent?"#86efac":C.border}`,
                      borderRadius:10,padding:"8px 10px",minWidth:90
                    }}>
                      <div style={{fontSize:10,fontWeight:800,
                        color:isCurrent?C.green:C.blue,marginBottom:4}}>
                        Week {CPS.find(cp=>cp.id===c.id)?.week}
                      </div>
                      {d.weight&&<div style={{fontSize:11,color:C.textMid,marginBottom:2}}>⚖️ {d.weight}kg</div>}
                      <div style={{fontSize:12,fontWeight:700,color:C.red}}>
                        🔴 {d.fat}%
                        {diff&&<span style={{fontSize:10,color:diff.fatD>=0?C.green:C.red,marginLeft:3}}>
                          ({diff.fatD>=0?"-":"+"}{Math.abs(diff.fatD).toFixed(1)})
                        </span>}
                      </div>
                      <div style={{fontSize:12,fontWeight:700,color:C.blue}}>
                        🔵 {d.muscle}%
                        {diff&&<span style={{fontSize:10,color:diff.musD>=0?C.green:C.red,marginLeft:3}}>
                          ({diff.musD>=0?"+":"-"}{Math.abs(diff.musD).toFixed(1)})
                        </span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Score column — shows TOTAL vs baseline */}
        <div style={{textAlign:"right", minWidth:60}}>
          {sBase ? (
            <>
              <div style={{fontSize:18, fontWeight:900,
                color: sBase.total>=0 ? C.green : C.red}}>
                {sBase.total>=0?"+":""}{sBase.total}
              </div>
              <div style={{fontSize:9, color:C.textFaint, marginTop:1}}>total pts</div>
              {sPrev && (
                <div style={{fontSize:11, fontWeight:700, marginTop:4,
                  color: sPrev.total>=0 ? C.green : C.red}}>
                  {sPrev.total>=0?"+":""}{sPrev.total.toFixed(1)}
                  <div style={{fontSize:9, color:C.textFaint, fontWeight:400}}>this round</div>
                </div>
              )}
            </>
          ) : (
            <div style={{fontSize:11, color:C.textFaint}}>
              {base && activeCP !== "baseline" ? "No data" : ""}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── TEAM CARD ─────────────────────────────────────────────────────────────────
function TeamCard({team,rank,healthScore,healthScoreRound,missionScore,checkins,activeCP,photos,expanded,onToggle}){
  const total = healthScore + missionScore;
  const medals = ["🥇","🥈","🥉"];
  const isTop3 = rank <= 3;
  const leaderCount = team.members.filter(m=>m.leader).length;

  return(
    <div className="chov" style={{background:"#fff", border:`1.5px solid ${isTop3?C.red:C.border}`,
      borderRadius:16, overflow:"hidden",
      boxShadow:isTop3?"0 2px 12px rgba(220,38,38,.1)":"0 1px 4px rgba(0,0,0,.05)"}}>

      <div style={{display:"grid", gridTemplateColumns:"44px 1fr auto", gap:12,
        padding:"16px 18px", alignItems:"center"}} onClick={onToggle}>
        <div style={{textAlign:"center"}}>
          {isTop3 ? <span style={{fontSize:26}}>{medals[rank-1]}</span>
                  : <span style={{fontSize:16, fontWeight:800, color:C.textFaint}}>{rank}</span>}
        </div>
        <div>
          <div style={{fontWeight:800, fontSize:15, color:C.text, marginBottom:5}}>{team.name}</div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
            {/* Total vs baseline */}
            <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
              background: healthScore>=0 ? C.greenBg : C.redBg,
              color: healthScore>=0 ? C.green : C.red,
              border:`1px solid ${healthScore>=0 ? C.greenBorder : C.redBorder}`}}>
              Health {healthScore>=0?"+":""}{healthScore} total
            </span>
            {/* This round change */}
            {healthScoreRound !== 0 && (
              <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                background: healthScoreRound>=0 ? C.blueBg : C.redBg,
                color: healthScoreRound>=0 ? C.blue : C.red,
                border:`1px solid ${healthScoreRound>=0 ? C.blueBorder : C.redBorder}`}}>
                {healthScoreRound>=0?"+":""}{healthScoreRound} this round
              </span>
            )}
            <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
              background:C.goldBg, color:C.gold, border:`1px solid ${C.goldBorder}`}}>
              Mission +{missionScore}
            </span>
            {leaderCount>0 && (
              <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20,
                background:C.goldBg, color:C.gold, border:`1px solid ${C.goldBorder}`}}>
                ⭐ {leaderCount} leader{leaderCount>1?"s":""}
              </span>
            )}
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:22, fontWeight:900, color:isTop3?C.red:C.textMid}}>
            {total>=0?"+":""}{Math.round(total*10)/10}
          </div>
          <div style={{fontSize:9, color:C.textFaint}}>total score</div>
          <div style={{fontSize:11, color:C.textFaint, marginTop:2}}>{expanded?"▲ hide":"▼ members"}</div>
        </div>
      </div>

      {expanded && (
        <div style={{borderTop:`1px solid ${C.border}`, padding:"4px 18px 16px"}}>
          <div style={{fontSize:10, fontWeight:700, color:C.textFaint, textTransform:"uppercase",
            letterSpacing:".1em", padding:"10px 0 4px"}}>

            <MemberRow key={m.key} m={m} checkins={checkins} activeCP={activeCP} photos={photos}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("leaderboard");
  const [checkins,setCheckins]=useState({});
  const [missions,setMissions]=useState({});
  const [photos,setPhotos]=useState({});
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [activeCP,setActiveCP]=useState("cp1");

  useEffect(()=>{
    const timeout=setTimeout(()=>setLoading(false),4000);
    try{
      db.ref("crc_checkins").on("value",s=>{setCheckins(s.val()||{});clearTimeout(timeout);setLoading(false);});
      db.ref("crc_missions").on("value",s=>setMissions(s.val()||{}));
      db.ref("crc_photos").on("value",s=>setPhotos(s.val()||{}));
    }catch{clearTimeout(timeout);setLoading(false);}
    return()=>{db.ref("crc_checkins").off();db.ref("crc_missions").off();db.ref("crc_photos").off();};
  },[]);

  // Get latest available CP for a member (fallback to most recent with data)
  function getLatestData(memberKey){
    const rec=checkins[memberKey]||{};
    const cpOrder=["cp4","cp3","cp2","cp1"];
    for(const c of cpOrder){ if(rec[c]) return{cp:c,data:rec[c]}; }
    return null;
  }

  const ranked=[...TEAMS].map(t=>{
    let health=0, healthRound=0;
    t.members.forEach(m=>{
      const history=checkins[m.key]||{};
      const base=history.baseline;
      const selectedData=history[activeCP];
      const latest=getLatestData(m.key);
      const curr=selectedData||(latest?.data);
      const usedCPId=selectedData?activeCP:latest?.cp;
      if(base&&curr){const s=calcScore(base,curr);if(s)health+=s.total;}
      if(curr&&usedCPId){
        const cpIdx=CPS.findIndex(c=>c.id===usedCPId);
        const prevCPId=cpIdx>1?CPS[cpIdx-1].id:"baseline";
        const prevData=history[prevCPId]||base;
        if(prevData&&curr){const s=calcScore(prevData,curr);if(s)healthRound+=s.total;}
      }
    });
    health=Math.round(health*10)/10;
    healthRound=Math.round(healthRound*10)/10;
    const mission=getMissionTotal(missions,t.id);
    return{...t,health,healthRound,mission,total:health+mission};
  }).sort((a,b)=>b.total-a.total).map((t,i)=>({...t,rank:i+1}));

  const TABS=[["leaderboard","🏆","Leaderboard"],["admin","🔐","Admin"]];

    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,background:C.bg}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{width:44,height:44,border:`4px solid ${C.border}`,borderTop:`4px solid ${C.red}`,borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontSize:14,color:C.textLight,fontWeight:600}}>Loading live data...</div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,paddingBottom:60}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .chov{transition:box-shadow .15s,transform .15s;cursor:pointer}
        .chov:hover{box-shadow:0 4px 20px rgba(15,23,42,.1)!important;transform:translateY(-1px)}
        select option{background:#fff;color:#0f172a}
        input::placeholder{color:#cbd5e1}
        input:focus,select:focus{outline:none;border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.15)!important}

      {/* HEADER */}
      <header style={{background:"linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#7f1d1d 100%)",padding:"36px 16px 30px",textAlign:"center"}}>
        <div style={{fontSize:10,letterSpacing:".22em",fontWeight:700,color:"rgba(255,255,255,.45)",textTransform:"uppercase",marginBottom:8}}>Central Retail · Tech Division</div>
        <h1 style={{fontSize:"clamp(22px,5vw,42px)",fontWeight:900,color:"#fff",letterSpacing:"-.02em",lineHeight:1.05}}>CRC Tech Fit Challenge 2026</h1>

            {CPS.filter(c=>c.id!=="baseline").map(c=>(
              <button key={c.id} onClick={()=>setActiveCP(c.id)} style={{border:"none",cursor:"pointer",fontWeight:700,fontSize:12,padding:"8px 16px",borderRadius:20,fontFamily:"'Inter',sans-serif",transition:"all .18s",background:activeCP===c.id?C.red:"#fff",color:activeCP===c.id?"#fff":C.textLight,border:`1px solid ${activeCP===c.id?C.red:C.border}`}}>
                {c.label} · W{c.week}
              </button>
            ))}
          </div>

          {/* Scoring rules */}
          <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 16px",marginBottom:14}}>
            <div style={{fontWeight:700,color:C.textMid,fontSize:11,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Scoring Rules</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6,fontSize:12}}>
              {[["Body Fat ↓ 0.1%","+1 pt",C.green],["Body Fat ↑ 0.1%","−1 pt",C.red],["Muscle ↑ 0.1%","+1 pt",C.green],["Muscle ↓ 0.1%","−1 pt",C.red]].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 10px",background:C.bg,borderRadius:8}}>
                  <span style={{color:C.textMid}}>{l}</span>
                  <span style={{fontWeight:800,color:c}}>{v}</span>
                </div>
              ))}
            </div>
            <div style={{marginTop:8,fontSize:11,color:C.textFaint}}>⭐ = Team leader · Tap a team to see members · 🥇 Team 1st = ฿20k · 🥈 Team 2nd = ฿10k · 🏅 Highest individual score = ฿5k</div>
          </div>

          {/* Top individual */}
          {(()=>{
            const allMembers=TEAMS.flatMap(t=>t.members.map(m=>{
              const history=checkins[m.key]||{};
              const base=history.baseline;
              const selectedData=history[activeCP];
              const latest=getLatestData(m.key);
              const curr=selectedData||(latest?.data);
              const usedCPId=selectedData?activeCP:latest?.cp;
              // Total vs baseline
              const sBase=(base&&curr)?calcScore(base,curr):null;
              // This round vs prev CP
              let sRound=null;
              if(curr&&usedCPId){
                const cpIdx=CPS.findIndex(c=>c.id===usedCPId);
                const prevCPId=cpIdx>1?CPS[cpIdx-1].id:"baseline";
                const prevData=history[prevCPId]||base;
                if(prevData&&curr) sRound=calcScore(prevData,curr);
              }
              const teamName=TEAMS.find(t=>t.members.some(mm=>mm.key===m.key))?.name||"";
              return{...m,score:sBase?sBase.total:null,scoreRound:sRound?sRound.total:null,teamName};
            })).filter(m=>m.score!=null).sort((a,b)=>b.score-a.score);

            if(!allMembers.length)return null;
            const top=allMembers[0];

            return(
              <div style={{background:"linear-gradient(135deg,#f0fdf4,#fffbeb)",
                border:"1.5px solid #86efac",borderRadius:14,padding:"14px 18px",
                marginBottom:4,display:"flex",alignItems:"center",gap:14,
                boxShadow:"0 2px 8px rgba(22,163,74,.1)"}}>
                <span style={{fontSize:28,flexShrink:0}}>🏅</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.green,
                    textTransform:"uppercase",letterSpacing:".08em",marginBottom:2}}>
                    Top Individual · ฿5,000
                  </div>
                  <div style={{fontWeight:800,fontSize:15,color:C.text}}>
                    {top.first} {top.last}
                  </div>
                  <div style={{fontSize:11,color:C.textLight}}>{top.teamName}</div>
                  {top.scoreRound!=null&&(
                    <div style={{fontSize:11,fontWeight:700,marginTop:3,
                      color:top.scoreRound>=0?C.blue:C.red}}>
                      {top.scoreRound>=0?"+":""}{top.scoreRound.toFixed(1)} pts this round
                    </div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:22,fontWeight:900,color:top.score>=0?C.green:C.red}}>
                    {top.score>=0?"+":""}{top.score.toFixed(1)}
                  </div>
                  <div style={{fontSize:9,color:C.textFaint}}>total pts</div>
                </div>
              </div>
            );
          })()}

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {ranked.map(t=>(
              <TeamCard key={t.id} team={t} rank={t.rank}
                healthScore={t.health} healthScoreRound={t.healthRound} missionScore={t.mission}
                checkins={checkins} activeCP={activeCP} photos={photos}
                expanded={expanded===t.id}
                onToggle={()=>setExpanded(expanded===t.id?null:t.id)}/>
            ))}
          </div>
        </>}

        {/* ADMIN */}
        {tab==="admin"&&<AdminPanel checkins={checkins} missions={missions} photos={photos} toast={setToast}/>}

      </main>

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
